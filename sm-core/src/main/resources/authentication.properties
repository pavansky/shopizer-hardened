
authToken.header=Authorization

#JWT authentication configuration for sm-shop
jwt.header=Authorization
# HS512 signing key: set JWT_SECRET (64+ bytes) in every real environment. The default is for local runs only.
jwt.secret=${JWT_SECRET:local-dev-only-shopizer-jwt-secret-change-me-0123456789abcdefghijklmnop}
# Access token lifetime in seconds (was 7 days).
jwt.expiration=${JWT_EXPIRATION_SECONDS:3600}


#Your facebook app informations
facebook.app.id=
facebook.app.secret=
facebook.app.access_token=








# Known development default, used only to log a startup warning when it is still in use.
jwt.secret.dev-default=local-dev-only-shopizer-jwt-secret-change-me-0123456789abcdefghijklmnop
