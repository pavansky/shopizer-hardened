# Default SMTP sender. Every value can be set from the environment; the defaults are the
# upstream Gmail sample. The demo stack points this at Mailpit (smtp, no auth).
mailSender.protocol=${SMTP_PROTOCOL:smtps}
mailSender.host=${SMTP_HOST:smtp.gmail.com}
mailSender.port=${SMTP_PORT:465}
mailSender.username=${SMTP_USERNAME:youremail@gmail.com}
mailSender.password=${SMTP_PASSWORD:yourpassword}
mailSender.mail.smtp.auth=${SMTP_AUTH:true}
mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
