# Full Shopizer demo stack: one command, production-shaped, runs offline.
#   cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d --build
# Expects the admin and storefront forks cloned next to this repository (see deploy/README.md).
name: shopizer

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: mysql:8.4
    command: ["--lower_case_table_names=0", "--character-set-server=utf8mb4", "--log-bin=binlog", "--binlog-expire-logs-seconds=604800"]
    environment:
      MYSQL_DATABASE: SALESMANAGER
      MYSQL_USER: shopizer
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/.env}
    volumes: [ "db-data:/var/lib/mysql" ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging
    networks: [backend]

  api:
    build: { context: .., dockerfile: Dockerfile }
    image: shopizer-api:local
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env (64+ characters)}
      CORS_ALLOWED_ORIGINS: http://localhost:${STOREFRONT_PORT:-3000},http://localhost:${ADMIN_PORT:-4200}
      # the XML placeholder loader falls back to system properties for these keys
      JAVA_TOOL_OPTIONS: >-
        -Ddb.jdbcUrl=jdbc:mysql://db:3306/SALESMANAGER?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
        -Ddb.user=shopizer -Ddb.password=${DB_PASSWORD}
        -Dshopizer.metrics.scrape-cidrs=172.28.0.0/16
        -Dconfig.reconciliation.pendingOrders.graceMinutes=${RECONCILE_GRACE_MINUTES:-15}
        -Dconfig.reconciliation.pendingOrders.delayMs=${RECONCILE_DELAY_MS:-300000}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      # order emails go to Mailpit; open http://localhost:8025 to read them
      EMAIL_SENDER: default
      SMTP_PROTOCOL: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
    ports: [ "${API_PORT:-8080}:8080" ]
    volumes: [ "cms-files:/files" ]
    restart: unless-stopped
    stop_grace_period: 40s
    logging: *logging
    networks: [backend, frontend]

  admin:
    build: { context: "${ADMIN_DIR:-../../shopizer-admin-hardened}", dockerfile: docker/Dockerfile-all }
    image: shopizer-admin:local
    environment:
      APP_BASE_URL: http://localhost:${API_PORT:-8080}/api
      APP_SHIPPING_URL: http://localhost:9090/api
      APP_MAP_API_KEY: ""
      APP_DEFAULT_LANGUAGE: en
    ports: [ "${ADMIN_PORT:-4200}:80" ]
    depends_on: [api]
    restart: unless-stopped
    logging: *logging
    networks: [frontend]

  storefront:
    build: { context: "${STOREFRONT_DIR:-../../shopizer-shop-hardened}", dockerfile: Dockerfile }
    image: shopizer-storefront:local
    environment:
      APP_API_URL: http://localhost:${API_PORT:-8080}/api
      APP_MERCHANT: DEFAULT
      APP_PAYMENT_TYPE: ${STOREFRONT_PAYMENT_TYPE:-MONEYORDER}
      APP_STRIPE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}
    ports: [ "${STOREFRONT_PORT:-3000}:80" ]
    depends_on: [api]
    restart: unless-stopped
    logging: *logging
    networks: [frontend]

  backup:
    image: mysql:8.4
    depends_on:
      db: { condition: service_healthy }
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - "./backup/backup.sh:/backup.sh:ro"
      - "./backup/dumps:/dumps"
    entrypoint: ["sh", "/backup.sh"]
    restart: unless-stopped
    logging: *logging
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: [ "${MAILPIT_PORT:-8025}:8025" ]
    restart: unless-stopped
    logging: *logging
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prom-data:/prometheus"
    ports: [ "${PROMETHEUS_PORT:-9090}:9090" ]
    restart: unless-stopped
    logging: *logging
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in deploy/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: [ "${GRAFANA_PORT:-3001}:3000" ]
    depends_on: [prometheus]
    restart: unless-stopped
    logging: *logging
    networks: [backend]

volumes:
  db-data:
  cms-files:
  prom-data:

networks:
  backend:
    ipam: { config: [ { subnet: 172.28.0.0/16 } ] }
  frontend:
