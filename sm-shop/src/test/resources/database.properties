#for using file database
#db.jdbcUrl=jdbc\:h2\:file\:./SALESMANAGER-TEST;AUTOCOMMIT=OFF;;mv_store=false;INIT\=CREATE SCHEMA IF NOT EXISTS SALESMANAGER
#for using memory database
db.jdbcUrl=jdbc\:h2\:mem\:SALESMANAGER-TEST;AUTOCOMMIT=OFF;;mv_store=false;INIT\=CREATE SCHEMA IF NOT EXISTS SALESMANAGER
db.user=test
db.password=password
db.driverClass=org.h2.Driver
hibernate.dialect=org.hibernate.dialect.H2Dialect

db.show.sql=false
db.preferredTestQuery=SELECT 1
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=create



##
## configuration pooling base de donn\uFFFDes
##
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=8
# Pagination over a collection fetch is paged in memory (HHH000104). sm-core tests fail on
# it (sm-core/src/test/resources/database.properties). Here it stays a warning until the
# category list query (PageableCategoryRepository.listByStore, GET /api/v1/category) stops
# join-fetching descriptions while paging; with true, CategoryManagementAPIIntegrationTest fails.
hibernate.query.fail_on_pagination_over_collection_fetch=false
