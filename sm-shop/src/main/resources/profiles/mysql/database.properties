##
## db config
##

#Need to run these commands before running shopizer - choose your username and password
#mysql>CREATE DATABASE SALESMANAGER;
#mysql>CREATE USER shopizer IDENTIFIED BY 'very-long-shopizer-password';
#mysql>GRANT ALL ON SALESMANAGER.* TO shopizer;
#mysql>FLUSH PRIVILEGES;

#db.jdbcUrl=jdbc:mysql://localhost:3306/SALESMANAGER?autoReconnect=true&serverTimeZone=UTC&useUnicode=true&characterEncoding=UTF-8
#db.user=shopizer_db_user
#db.password=shopizer_db_password
db.driverClass=com.mysql.cj.jdbc.Driver
hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect


# SQL echo writes every statement to stdout on the request thread; enable only to debug
db.show.sql=${DB_SHOW_SQL:false}
db.preferredTestQuery=SELECT 1
db.schema=SALESMANAGER
# Schema changes ship as Flyway migrations (db/migration). Hibernate only checks the mapping.
hibernate.hbm2ddl.auto=validate



##
## configuration pooling base de donn\uFFFDes
##
db.initialPoolSize=8
db.minPoolSize=8
db.maxPoolSize=15
# ms a request waits for a free connection before it fails (answered as 503 + Retry-After)
db.connectionTimeout=2000
