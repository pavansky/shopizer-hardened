#Spring boot configurations
#logging.config=log4j-shopizer.properties
server.port=8080


#Turn Statistics on
#spring.jpa.properties.hibernate.generate_statistics=true
#default database schema
spring.jpa.properties.hibernate.default_schema=SALESMANAGER
#logging.level.org.hibernate.stat=debug

# Enable logging to verify that HikariCP is used, the second entry is specific to HikariCP
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari.HikariConfig=INFO
#TRACE will print binding
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

#when running from IDE (eclipse) or from springboot:run command
#server.contextPath=/shopizer

logging.level.org.springframework=ERROR
logging.level.com.shopizer=INFO
logging.level.org.hibernate=ERROR
# keep HHH000104 visible: a query paged in memory over a collection fetch reads every row
logging.level.org.hibernate.hql.internal.ast.QueryTranslatorImpl=WARN
logging.level.org.apache.http=ERROR

#logging.file=shopizer.log

#Default Spring white label error page
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=10MB


#hibernate 5
spring.jpa.hibernate.use-new-id-generator-mappings=true

# Open-in-view stays on, deliberately: the sm-shop facades and mappers read lazy
# associations outside any transaction and rely on the request-scoped EntityManager.
# It no longer pins a JDBC connection for the whole request, because DataConfiguration
# releases the connection after each transaction (hibernate.connection.handling_mode).
spring.jpa.open-in-view=true


#Spring boot 2.X
spring.main.allow-bean-definition-overriding: true

#build informations
application-description=@project.description@
application-version=@project.version@
build.timestamp=@maven.build.timestamp@

#actuator
# Only health and info are public. metrics and prometheus are exposed for scraping and require the admin role.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

management.health.elasticsearch.enabled=false
management.health.mail.enabled=false
management.health.ping.enabled=true

#graceful shutdown: finish in-flight checkouts before the JVM exits
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

#CORS allow-list for the storefront and admin (comma separated)
shopizer.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

#schema migrations: off for the H2 demo profiles, on (with hbm2ddl validate) for mysql, gcp and cloud
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=SALESMANAGER
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


#latency histograms for p95/p99 dashboards and SLO alerts
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s
management.metrics.tags.application=shopizer-api
