# Default profile: embedded H2 file database in the working directory, so a fresh
# clone starts with no setup. Use the mysql, gcp or cloud profiles for real environments.
db.jdbcUrl=jdbc\:h2\:file\:./SALESMANAGER;AUTOCOMMIT=OFF;;mv_store=false;INIT\=CREATE SCHEMA IF NOT EXISTS SALESMANAGER
db.user=${H2_USER:test}
db.password=${H2_PASSWORD:password}
db.driverClass=org.h2.Driver
hibernate.dialect=org.hibernate.dialect.H2Dialect
db.show.sql=false
db.preferredTestQuery=SELECT 1
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=update
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=8
